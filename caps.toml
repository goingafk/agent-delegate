# agent-delegate caps and policy. Edit this file for your own plans and models.
# Model names below are examples of what the author's CLIs accepted; run
# `./delegate.py probe --model <name>` after changing them.

[routing]
# Order tried when a cap blocks an agent; the refusal message suggests the next one.
order = ["copilot-free", "codex", "claude-opus", "claude-sonnet", "copilot-premium"]

[codex]
allowed_models = ["gpt-6.1-sol", "gpt-6-astra", "gpt-6-sol"]
default_model = "gpt-6.1-sol"
heavy_model = "gpt-6-astra"
five_hour_max_pct = 90     # refuse new Codex runs above this share of the 5-hour window
weekly_max_pct = 90

[claude]
allowed_models = ["claude-sonnet-5-5", "claude-opus-5-5"]
default_budget_usd = 8.0         # --max-budget-usd for every claude run unless the spec/flag sets one
high_effort_budget_usd = 15.0    # used for high/xhigh/max effort
setting_sources = "project,local"   # "" leaves Claude's defaults; project,local skips user plugins/hooks (faster, cheaper)
opus_requires_reason = false     # true = Opus runs need --opus-reason

[claude.sonnet]
five_hour_max_pct = 90
weekly_max_pct = 90
daily_calls = 50

[claude.opus]
five_hour_max_pct = 80
weekly_max_pct = 80
daily_calls = 30
weekly_calls = 100

[copilot]
allowed_models = ["gpt-5-mini", "claude-haiku-5.5", "gemini-3.8-flash", "gpt-6-luna", "grok-4.7", "claude-sonnet-5.5"]
free_models = ["gpt-5-mini"]     # models that do not consume premium requests
premium_weekly_max = 40

[qwen]
# Local Ollama models (qwen_delegate.py; host from QWEN_HOST, default http://localhost:11434). Review/draft only.
allowed_models = ["qwen3.8:27b", "gemma4:26b"]

[jobs]
max_running = 4          # detached jobs started with `delegate.py start`

[jobs.per_agent]
codex = 2
claude = 2
copilot = 2
qwen = 1

[effort]
# Effort by model and spec risk ("low" | "high"). An explicit spec/flag effort always wins.
"claude-opus-5-5" = { low = "medium", high = "high" }
"claude-sonnet-5-5" = { low = "medium", high = "medium" }
"gpt-6.1-sol" = { low = "medium", high = "high" }
"gpt-6-astra" = { low = "medium", high = "high" }
"gpt-6-sol" = { low = "medium", high = "high" }

[library]
# Playbooks (library/*.md) appended to every spec-built brief. A spec's `skills` list adds more;
# `skills = []` turns the defaults off. max_chars bounds the whole Playbooks section.
max_chars = 12000
[library.defaults]
implement = ["engineering-discipline"]
review = ["review-findings"]

# Optional: override the standing rules added to every brief.
# [brief]
# standing = ["Staging only: no git push, no deploy, no production writes.", "..."]
